<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shadow Gallery — a stealth game</title>
<style>
  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #0b0d13;
  }
  body {
    display: grid;
    place-items: center;
  }
  #game {
    display: block;
    width: min(100vw, 160vh);
    height: auto;
    aspect-ratio: 8 / 5;
    max-height: 100vh;
    touch-action: none;
    background: #232833;
  }
  #status {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="800" aria-label="Shadow Gallery: sneak through the museum, steal the artifacts, and reach the exit unseen"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { Game } from './src/game.js';
  const canvas = document.getElementById('game');
  new Game(canvas);
</script>
</body>
</html>
